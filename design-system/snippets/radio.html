<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIDIZ 정본 조각 — Radio</title>
<!--
  SIDIZ 정본 코드 조각 — Radio (node 66:1837)
  타깃 16×16 · 원 14×14 · radius pill · 내부 점 9×9
  Inactive=보더 Grey-300 / Activated=보더 Grey-900 + 점 Grey-900
  ⚠️ 그대로 복사해 쓴다.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../../dist/sidiz/tokens.css">

<!-- ▼▼▼ 조각 CSS (그대로 복사) ▼▼▼ -->
<style>
.sidiz-radio{ display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; cursor:pointer; }
.sidiz-radio__circle{
  display:inline-flex; align-items:center; justify-content:center;
  width:14px; height:14px;
  border:1px solid var(--sidiz-color-grey-300); border-radius:var(--sidiz-radius-pill);
  background:var(--sidiz-color-grey-50);
}
.sidiz-radio__dot{ width:9px; height:9px; border-radius:var(--sidiz-radius-pill); background:var(--sidiz-color-grey-900); }
.sidiz-radio--active .sidiz-radio__circle{ border-color:var(--sidiz-color-grey-900); }
</style>
<!-- ▲▲▲ 조각 CSS 끝 ▲▲▲ -->

<style>
body{ background:var(--sidiz-color-grey-50); }
.preview{ padding:var(--sidiz-space-40); display:flex; gap:var(--sidiz-space-16); }
</style>
</head>
<body>
<div class="preview">
  <!-- ▼ 조각 마크업 — 그대로 복사 ▼ -->
  <span class="sidiz-radio"><span class="sidiz-radio__circle"></span></span>
  <span class="sidiz-radio sidiz-radio--active"><span class="sidiz-radio__circle"><span class="sidiz-radio__dot"></span></span></span>
  <!-- ▲ 조각 마크업 끝 ▲ -->
</div>
</body>
</html>
