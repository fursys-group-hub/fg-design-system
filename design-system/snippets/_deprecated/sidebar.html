<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIDIZ 정본 조각 — Sidebar</title>
<!--
  ============================================================================
  SIDIZ 정본 코드 조각 — Sidebar
  ----------------------------------------------------------------------------
  출처: Figma `시디즈_디자인 시스템` · 3. Component · Sidebar (node 69:5382)

  [컨테이너] W256 · padding 좌우 12 · gap 24 · 배경 Grey-50 · 보더 Grey-200 · shadow/sm
  [브랜드]   Attention 로고 18×25 + 시스템명 Title5(Grey-900). gap 16. (로고 아이콘 대체 금지)
  [검색]     232×38 · gap 12 · padding 0/12 · radius 4 · 보더 Grey-200 · placeholder Body1 Grey-400
  [메뉴항목] 232×34 · gap 12 · padding 0/12 · Body1 · Grey-900 (아이콘 16). 목록 gap 2.
  [활성/hover] 활성 메뉴만 Blue-700 전경 + Blue-100 배경.

  ⚠️ 화면 생성 시 이 조각을 그대로 복사해 쓴다.
  ============================================================================
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../../dist/sidiz/tokens.css">
<script src="https://unpkg.com/lucide@latest"></script>

<!-- ▼▼▼ 조각 CSS (그대로 복사) ▼▼▼ -->
<style>
.sidiz-sidebar{
  width:256px;
  display:flex; flex-direction:column; gap:var(--sidiz-space-24);
  padding:0 var(--sidiz-space-12);
  background:var(--sidiz-color-grey-50);
  border-right:1px solid var(--sidiz-color-grey-200);
  box-shadow:var(--sidiz-shadow-sm);
}
.sidiz-sidebar__brand{ display:flex; align-items:center; gap:var(--sidiz-space-16); }
.sidiz-sidebar__logo{ width:18px; height:25px; flex:0 0 auto; }
.sidiz-sidebar__title{
  font-size:var(--sidiz-font-size-title5); font-weight:var(--sidiz-font-weight-semibold);
  line-height:var(--sidiz-font-line-height); letter-spacing:var(--sidiz-font-letter-spacing);
  color:var(--sidiz-color-grey-900);
}
.sidiz-sidebar__search{
  display:flex; align-items:center; gap:var(--sidiz-space-12);
  height:38px; padding:0 var(--sidiz-space-12);
  border:1px solid var(--sidiz-color-grey-200); border-radius:var(--sidiz-radius-4);
  background:var(--sidiz-color-grey-50);
}
.sidiz-sidebar__search svg{ width:16px; height:16px; color:var(--sidiz-color-grey-400); flex:0 0 auto; }
.sidiz-sidebar__search input{
  border:0; outline:0; background:transparent; flex:1; min-width:0;
  font-size:var(--sidiz-font-size-body1); font-weight:var(--sidiz-font-weight-semibold);
  line-height:var(--sidiz-font-line-height); letter-spacing:var(--sidiz-font-letter-spacing);
  color:var(--sidiz-color-grey-900);
}
.sidiz-sidebar__search input::placeholder{ color:var(--sidiz-color-grey-400); }
.sidiz-sidebar__menu{ display:flex; flex-direction:column; gap:var(--sidiz-space-2); }
.sidiz-sidebar__item{
  display:flex; align-items:center; gap:var(--sidiz-space-12);
  height:34px; padding:0 var(--sidiz-space-12);
  border-radius:var(--sidiz-radius-4);
  background:transparent;
  font-size:var(--sidiz-font-size-body1); font-weight:var(--sidiz-font-weight-semibold);
  line-height:var(--sidiz-font-line-height); letter-spacing:var(--sidiz-font-letter-spacing);
  color:var(--sidiz-color-grey-900); cursor:pointer;
}
.sidiz-sidebar__item svg{ width:16px; height:16px; flex:0 0 auto; }
.sidiz-sidebar__item--active{ background:var(--sidiz-color-blue-100); color:var(--sidiz-color-blue-700); }
</style>
<!-- ▲▲▲ 조각 CSS 끝 ▲▲▲ -->

<style>
/* (미리보기 전용 — 조각 아님) */
body{ background:var(--sidiz-color-grey-50); }
.preview{ display:flex; gap:var(--sidiz-space-40); padding:var(--sidiz-space-40); }
.preview .sidiz-sidebar{ padding-top:var(--sidiz-space-24); padding-bottom:var(--sidiz-space-24); }
</style>
</head>
<body>
<div class="preview">
  <!-- ▼ 조각 마크업 — 그대로 복사 ▼ -->
  <aside class="sidiz-sidebar">
    <div class="sidiz-sidebar__brand">
      <svg class="sidiz-sidebar__logo" viewBox="0 0 60 84.3129" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M60 0L0 15.5146V37.2516C0 37.7216 0.30934 38.1321 0.755503 38.2451L45.3896 49.7858L0 61.5289V84.3129L60 68.7983V47.1148C60 46.6449 59.6907 46.2344 59.2445 46.1214L14.5033 34.5509L60 22.7841V0Z" fill="black"/></svg>
      <span class="sidiz-sidebar__title">SIDIZ ADMIN</span>
    </div>
    <div class="sidiz-sidebar__search">
      <i data-lucide="search"></i>
      <input placeholder="검색">
    </div>
    <nav class="sidiz-sidebar__menu">
      <div class="sidiz-sidebar__item sidiz-sidebar__item--active"><i data-lucide="clipboard-list"></i>주문 관리</div>
      <div class="sidiz-sidebar__item"><i data-lucide="layout-dashboard"></i>대시보드</div>
      <div class="sidiz-sidebar__item"><i data-lucide="package"></i>상품 관리</div>
      <div class="sidiz-sidebar__item"><i data-lucide="bar-chart-big"></i>매출 통계</div>
      <div class="sidiz-sidebar__item"><i data-lucide="settings"></i>설정</div>
    </nav>
  </aside>
  <!-- ▲ 조각 마크업 끝 ▲ -->
</div>
<script>lucide.createIcons();</script>
</body>
</html>
