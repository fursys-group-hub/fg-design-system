<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIDIZ 정본 조각 — Input</title>
<!--
  SIDIZ 정본 코드 조각 — Input (node 69:7170)
  H36 · radius 4 · padding 8/12 · gap 12 · 텍스트 Body2(13/400)
  보더: Default=Grey-200 / Hover·Filled=Grey-900(활성) / Disabled=Grey-300+배경 Grey-200 · 텍스트/placeholder Grey-400
  ⚠️ 그대로 복사해 쓴다.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../../dist/fg/tokens.css">
<script src="https://unpkg.com/lucide@latest"></script>

<!-- ▼▼▼ 조각 CSS (그대로 복사) ▼▼▼ -->
<style>
.fg-input{
  display:inline-flex; align-items:center; gap:var(--fg-space-12);
  height:36px; padding:var(--fg-space-8) var(--fg-space-12);
  border:1px solid var(--fg-color-grey-200); border-radius:var(--fg-radius-4);
  background:var(--fg-color-grey-50);
}
.fg-input svg{ width:16px; height:16px; color:var(--fg-color-grey-400); flex:0 0 auto; }
.fg-input input, .fg-input select{
  border:0; outline:0; background:transparent; flex:1; min-width:0;
  font-size:var(--fg-font-size-body2); font-weight:var(--fg-font-weight-regular);
  line-height:var(--fg-font-line-height); letter-spacing:var(--fg-font-letter-spacing);
  color:var(--fg-color-grey-900);
}
.fg-input input::placeholder{ color:var(--fg-color-grey-400); }
.fg-input--active  { border-color:var(--fg-color-grey-900); }
.fg-input--disabled{ background:var(--fg-color-grey-200); border-color:var(--fg-color-grey-300); }
</style>
<!-- ▲▲▲ 조각 CSS 끝 ▲▲▲ -->

<style>
body{ background:var(--fg-color-grey-50); }
.preview{ padding:var(--fg-space-40); display:flex; flex-direction:column; gap:var(--fg-space-12); }
.preview h1{ font-size:var(--fg-font-size-title3); font-weight:600; }
</style>
</head>
<body>
<div class="preview">
  <h1 class="title3">Input — 정본 조각 미리보기</h1>
  <!-- ▼ 조각 마크업 예시 ▼ -->
  <span class="fg-input"><i data-lucide="search"></i><input placeholder="주문번호 · 고객명"></span>
  <span class="fg-input fg-input--active"><i data-lucide="calendar"></i><input value="2026-08-19"></span>
  <span class="fg-input"><select><option>전체</option><option>결제완료</option></select><i data-lucide="chevron-down"></i></span>
  <span class="fg-input fg-input--disabled"><input placeholder="비활성" disabled></span>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
