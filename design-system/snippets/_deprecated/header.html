<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIDIZ 정본 조각 — Header</title>
<!--
  ============================================================================
  SIDIZ 정본 코드 조각 — Header
  ----------------------------------------------------------------------------
  출처: Figma `시디즈_디자인 시스템` · 3. Component · Header (node 68:4651)

  [컨테이너] 1344×50 · padding 0/24 · 가로 SPACE_BETWEEN · 교차 CENTER
             · 배경 Grey-50 · 하단 보더 Grey-200
  [좌측] Icon/PanelLeft 20×20 (Grey-900)
  [우측] gap 24
        - 알림: Icon/Bell 20×20 + 알림 뱃지(Red-600 pill · "N" Caption2 · Grey-50)
        - 프로필 박스: padding 6/12/6/16 · radius pill · 보더 Grey-200 · 배경 Grey-50
          · 담당자(Body1 Grey-900) + "님"(Body1 Grey-400)
          · 포지션(Caption1 Grey-400, 배경 Grey-100, padding 0/4)
          · Icon/ChevronDown 16×16 (Grey-400)

  ⚠️ 화면 생성 시 이 조각을 그대로 복사해 쓴다. 알림 뱃지·프로필 보더 박스 생략 금지.
  ============================================================================
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../../dist/fg/tokens.css">
<script src="https://unpkg.com/lucide@latest"></script>

<!-- ▼▼▼ 조각 CSS (그대로 복사) ▼▼▼ -->
<style>
.fg-header{
  display:flex; align-items:center; justify-content:space-between;
  width:1344px; height:50px;
  padding:0 var(--fg-space-24);
  background:var(--fg-color-grey-50);
  border-bottom:1px solid var(--fg-color-grey-200);
}
.fg-header__toggle{ display:inline-flex; }
.fg-header__toggle svg{ width:20px; height:20px; color:var(--fg-color-grey-900); }
.fg-header__right{ display:flex; align-items:center; gap:var(--fg-space-24); }
.fg-header__bell{ position:relative; display:inline-flex; }
.fg-header__bell svg{ width:20px; height:20px; color:var(--fg-color-grey-900); }
.fg-header__badge{
  position:absolute; top:0; right:0;
  display:inline-flex; align-items:center; justify-content:center;
  padding:0 var(--fg-space-4); border-radius:var(--fg-radius-pill);
  background:var(--fg-color-red-600);
  font-size:var(--fg-font-size-caption2); font-weight:var(--fg-font-weight-semibold);
  line-height:var(--fg-font-line-height); letter-spacing:var(--fg-font-letter-spacing);
  color:var(--fg-color-grey-50);
}
.fg-header__profile{
  display:flex; align-items:center; gap:var(--fg-space-4);
  height:32px; padding:var(--fg-space-6) var(--fg-space-12) var(--fg-space-6) var(--fg-space-16);
  border:1px solid var(--fg-color-grey-200); border-radius:var(--fg-radius-pill);
  background:var(--fg-color-grey-50); cursor:pointer;
}
.fg-header__user{ display:flex; align-items:center; gap:var(--fg-space-4); }
.fg-header__name-group{ display:flex; align-items:center; gap:var(--fg-space-2); }
.fg-header__name{
  font-size:var(--fg-font-size-body1); font-weight:var(--fg-font-weight-semibold);
  line-height:var(--fg-font-line-height); letter-spacing:var(--fg-font-letter-spacing);
  color:var(--fg-color-grey-900);
}
.fg-header__suffix{
  font-size:var(--fg-font-size-body1); font-weight:var(--fg-font-weight-semibold);
  line-height:var(--fg-font-line-height); letter-spacing:var(--fg-font-letter-spacing);
  color:var(--fg-color-grey-400);
}
.fg-header__position{
  padding:0 var(--fg-space-4);
  background:var(--fg-color-grey-100);
  font-size:var(--fg-font-size-caption1); font-weight:var(--fg-font-weight-semibold);
  line-height:var(--fg-font-line-height); letter-spacing:var(--fg-font-letter-spacing);
  color:var(--fg-color-grey-400);
}
.fg-header__profile svg{ width:16px; height:16px; color:var(--fg-color-grey-400); }
</style>
<!-- ▲▲▲ 조각 CSS 끝 ▲▲▲ -->

<style>
/* (미리보기 전용 — 조각 아님) */
body{ background:var(--fg-color-grey-50); }
.preview{ padding:var(--fg-space-40); }
</style>
</head>
<body>
<div class="preview">
  <!-- ▼ 조각 마크업 — 그대로 복사 ▼ -->
  <header class="fg-header">
    <span class="fg-header__toggle"><i data-lucide="panel-left"></i></span>
    <div class="fg-header__right">
      <span class="fg-header__bell">
        <i data-lucide="bell"></i>
        <span class="fg-header__badge">N</span>
      </span>
      <div class="fg-header__profile">
        <span class="fg-header__user">
          <span class="fg-header__name-group">
            <span class="fg-header__name">담당자</span>
            <span class="fg-header__suffix">님</span>
          </span>
          <span class="fg-header__position">포지션명</span>
        </span>
        <i data-lucide="chevron-down"></i>
      </div>
    </div>
  </header>
  <!-- ▲ 조각 마크업 끝 ▲ -->
</div>
<script>lucide.createIcons();</script>
</body>
</html>
