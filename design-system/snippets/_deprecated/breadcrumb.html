<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIDIZ 정본 조각 — Breadcrumb</title>
<!--
  SIDIZ 정본 코드 조각 — Breadcrumb (node 69:8870)
  gap 8 · 상위 Body2(13/400) Grey-400 · 현재 Body1(13/600) Grey-900 · 구분자 ChevronRight 12×12 Grey-400
  구분자는 chevron 아이콘 사용(·/• 금지). ⚠️ 그대로 복사해 쓴다.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../../dist/fg/tokens.css">
<script src="https://unpkg.com/lucide@latest"></script>

<!-- ▼▼▼ 조각 CSS (그대로 복사) ▼▼▼ -->
<style>
.fg-breadcrumb{
  display:flex; align-items:center; gap:var(--fg-space-8);
  font-size:var(--fg-font-size-body2); font-weight:var(--fg-font-weight-regular);
  line-height:var(--fg-font-line-height); letter-spacing:var(--fg-font-letter-spacing);
  color:var(--fg-color-grey-400);
}
.fg-breadcrumb svg{ width:12px; height:12px; color:var(--fg-color-grey-400); }
.fg-breadcrumb__current{
  font-weight:var(--fg-font-weight-semibold);
  color:var(--fg-color-grey-900);
}
</style>
<!-- ▲▲▲ 조각 CSS 끝 ▲▲▲ -->

<style>
body{ background:var(--fg-color-grey-50); }
.preview{ padding:var(--fg-space-40); }
</style>
</head>
<body>
<div class="preview">
  <!-- ▼ 조각 마크업 — 그대로 복사 ▼ -->
  <nav class="fg-breadcrumb">
    <span>홈</span><i data-lucide="chevron-right"></i>
    <span>주문</span><i data-lucide="chevron-right"></i>
    <span class="fg-breadcrumb__current">주문 관리</span>
  </nav>
  <!-- ▲ 조각 마크업 끝 ▲ -->
</div>
<script>lucide.createIcons();</script>
</body>
</html>
