<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIDIZ 정본 조각 — Button</title>
<!--
  SIDIZ 정본 코드 조각 — Button (node 69:6191)
  Square/Round/Text=H32 · Flat=H24 · gap 8 · padding 0/12(Flat 0/10)
  radius: Square=4 · Round/Text/Flat=pill · 텍스트 Round/Square=Body1(13/600) · Text/Flat=Body3(12/600)
  색: Primary=Grey-900 / Secondary=Grey-900+Grey-200보더 / Disabled=Grey-400/Grey-200 / Error=Red-600
  결정 버튼은 화면당 1개(Primary=Grey-900). 파란 채움 버튼 금지. ⚠️ 그대로 복사해 쓴다.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../../dist/fg/tokens.css">
<script src="https://unpkg.com/lucide@latest"></script>

<!-- ▼▼▼ 조각 CSS (그대로 복사) ▼▼▼ -->
<style>
.fg-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:var(--fg-space-8);
  height:32px; padding:0 var(--fg-space-12);
  border:1px solid transparent; border-radius:var(--fg-radius-4);
  font-size:var(--fg-font-size-body1); font-weight:var(--fg-font-weight-semibold);
  line-height:var(--fg-font-line-height); letter-spacing:var(--fg-font-letter-spacing);
  cursor:pointer;
}
.fg-btn svg{ width:16px; height:16px; }
/* Variant */
.fg-btn--primary  { background:var(--fg-color-grey-900); color:var(--fg-color-grey-50); }
.fg-btn--secondary{ background:var(--fg-color-grey-50); color:var(--fg-color-grey-900); border-color:var(--fg-color-grey-200); }
.fg-btn--disabled { background:var(--fg-color-grey-200); color:var(--fg-color-grey-400); cursor:not-allowed; }
.fg-btn--error    { background:var(--fg-color-grey-50); color:var(--fg-color-red-600); border-color:var(--fg-color-red-600); }
/* Shape */
.fg-btn--round{ border-radius:var(--fg-radius-pill); }
.fg-btn--text {
  border-radius:var(--fg-radius-pill); background:transparent;
  font-size:var(--fg-font-size-body3); font-weight:var(--fg-font-weight-semibold);
}
.fg-btn--flat {
  height:24px; padding:0 var(--fg-space-10); border-radius:var(--fg-radius-pill);
  font-size:var(--fg-font-size-body3); font-weight:var(--fg-font-weight-semibold);
}
</style>
<!-- ▲▲▲ 조각 CSS 끝 ▲▲▲ -->

<style>
body{ background:var(--fg-color-grey-50); }
.preview{ padding:var(--fg-space-40); display:flex; flex-direction:column; gap:var(--fg-space-16); }
.preview .row{ display:flex; align-items:center; gap:var(--fg-space-8); }
.preview h1{ font-size:var(--fg-font-size-title3); font-weight:600; }
.preview .cap{ font-size:var(--fg-font-size-caption1); font-weight:600; color:var(--fg-color-grey-500); }
</style>
</head>
<body>
<div class="preview">
  <h1 class="title3">Button — 정본 조각 미리보기</h1>
  <span class="cap">Square (기본)</span>
  <div class="row">
    <button class="fg-btn fg-btn--primary"><i data-lucide="plus"></i>주문 등록</button>
    <button class="fg-btn fg-btn--secondary">초기화</button>
    <button class="fg-btn fg-btn--disabled">비활성</button>
    <button class="fg-btn fg-btn--error"><i data-lucide="trash-2"></i>삭제</button>
  </div>
  <span class="cap">Round</span>
  <div class="row">
    <button class="fg-btn fg-btn--round fg-btn--primary"><i data-lucide="search"></i>조회</button>
    <button class="fg-btn fg-btn--round fg-btn--secondary">필터</button>
  </div>
  <span class="cap">Text / Flat</span>
  <div class="row">
    <button class="fg-btn fg-btn--text fg-btn--primary">더보기</button>
    <button class="fg-btn fg-btn--flat fg-btn--primary">닫기</button>
    <button class="fg-btn fg-btn--flat fg-btn--secondary">취소</button>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
