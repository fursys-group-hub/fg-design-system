<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIDIZ 정본 조각 — Input Case</title>
<!--
  SIDIZ 정본 코드 조각 — Input Case / Field (node 66:2132)
  314×84 · 세로 gap 6 : 라벨(Body3 Grey-500, 필수 * Red-600) + Input(H36) + 헬프/에러(gap 4, Body4 Red-600 + CircleAlert)
  ⚠️ 그대로 복사해 쓴다.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../../dist/sidiz/tokens.css">
<script src="https://unpkg.com/lucide@latest"></script>

<!-- ▼▼▼ 조각 CSS (그대로 복사) ▼▼▼ -->
<style>
.sidiz-input-case{ display:flex; flex-direction:column; gap:var(--sidiz-space-6); width:314px; }
.sidiz-input-case__label{
  font-size:var(--sidiz-font-size-body3); font-weight:var(--sidiz-font-weight-semibold);
  line-height:var(--sidiz-font-line-height); letter-spacing:var(--sidiz-font-letter-spacing);
  color:var(--sidiz-color-grey-500);
}
.sidiz-input-case__required{ color:var(--sidiz-color-red-600); }
.sidiz-input-case__field{
  display:flex; align-items:center; gap:var(--sidiz-space-8);
  height:36px; padding:var(--sidiz-space-8) var(--sidiz-space-12);
  border:1px solid var(--sidiz-color-grey-200); border-radius:var(--sidiz-radius-4);
  background:var(--sidiz-color-grey-50);
}
.sidiz-input-case__field input{
  border:0; outline:0; background:transparent; flex:1; min-width:0;
  font-size:var(--sidiz-font-size-body2); font-weight:var(--sidiz-font-weight-regular);
  line-height:var(--sidiz-font-line-height); letter-spacing:var(--sidiz-font-letter-spacing);
  color:var(--sidiz-color-grey-900);
}
.sidiz-input-case__field input::placeholder{ color:var(--sidiz-color-grey-400); }
.sidiz-input-case__help{ display:flex; align-items:center; gap:var(--sidiz-space-4); }
.sidiz-input-case__help svg{ width:16px; height:16px; color:var(--sidiz-color-red-600); }
.sidiz-input-case__error{
  font-size:var(--sidiz-font-size-body4); font-weight:var(--sidiz-font-weight-regular);
  line-height:var(--sidiz-font-line-height); letter-spacing:var(--sidiz-font-letter-spacing);
  color:var(--sidiz-color-red-600);
}
</style>
<!-- ▲▲▲ 조각 CSS 끝 ▲▲▲ -->

<style>
body{ background:var(--sidiz-color-grey-50); }
.preview{ padding:var(--sidiz-space-40); }
</style>
</head>
<body>
<div class="preview">
  <!-- ▼ 조각 마크업 — 그대로 복사 ▼ -->
  <div class="sidiz-input-case">
    <span class="sidiz-input-case__label">서브 타이틀 <span class="sidiz-input-case__required">*</span></span>
    <span class="sidiz-input-case__field"><input placeholder="텍스트를 입력해 주세요"></span>
    <span class="sidiz-input-case__help">
      <i data-lucide="circle-alert"></i>
      <span class="sidiz-input-case__error">에러 메세지</span>
    </span>
  </div>
  <!-- ▲ 조각 마크업 끝 ▲ -->
</div>
<script>lucide.createIcons();</script>
</body>
</html>
