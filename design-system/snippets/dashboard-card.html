<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIDIZ 정본 조각 — Dashboard Card</title>
<!--
  ============================================================================
  SIDIZ 정본 코드 조각 — Dashboard Card
  ----------------------------------------------------------------------------
  출처: Figma `시디즈_디자인 시스템` · 3. Component · Dashboard Card (node 69:8975)

  [컨테이너] 314×65 · padding 16/20 · radius 4 · 배경 Grey-50 · 보더 Grey-200
             · 내부 가로(HORIZONTAL) · 교차 CENTER · gap 0 · 그림자 없음
  [좌측] Tag(State=Light, Color=Black): padding 0/4 · radius 2 · Caption1 · Grey-900
  [우측] 값 그룹(grow, 우측·하단 정렬, gap 4):
        - 수치 Title3 · Grey-900 (상태 연동: 포인트=Blue-700 / 에러=Red-600)
        - 단위 "건" Caption1 · Grey-900 (하단 baseline 보정 padding-bottom 5)

  [배열] 요약 카드는 가로 1행 · 카드 간 gap 8 (tokens.css `.dashboard-cards`). 세로 스택 금지.
  ⚠️ 화면 생성 시 이 조각을 그대로 복사해 쓴다. 새로 그리거나 값을 바꾸지 않는다.
  ============================================================================
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../../dist/sidiz/tokens.css">

<!-- ▼▼▼ 조각 CSS (그대로 복사) ▼▼▼ -->
<style>
.sidiz-dashboard-card{
  display:flex; flex-direction:row; align-items:center;
  width:314px; height:65px;
  padding:var(--sidiz-space-16) var(--sidiz-space-20);
  border:1px solid var(--sidiz-color-grey-200);
  border-radius:var(--sidiz-radius-4);
  background:var(--sidiz-color-grey-50);
}
.sidiz-dashboard-card__tag{
  flex:0 0 auto;
  display:inline-flex; align-items:center; justify-content:center;
  min-width:28px;
  padding:0 var(--sidiz-space-4);
  border:1px solid var(--sidiz-color-grey-200);
  border-radius:var(--sidiz-radius-2);
  background:var(--sidiz-color-grey-50);
  font-size:var(--sidiz-font-size-caption1); font-weight:var(--sidiz-font-weight-semibold);
  line-height:var(--sidiz-font-line-height); letter-spacing:var(--sidiz-font-letter-spacing);
  color:var(--sidiz-color-grey-900); white-space:nowrap;
}
.sidiz-dashboard-card__value{
  flex:1; display:flex; align-items:flex-end; justify-content:flex-end; gap:var(--sidiz-space-4);
}
.sidiz-dashboard-card__num{
  font-size:var(--sidiz-font-size-title3); font-weight:var(--sidiz-font-weight-semibold);
  line-height:var(--sidiz-font-line-height); letter-spacing:var(--sidiz-font-letter-spacing);
  color:var(--sidiz-color-grey-900);
}
.sidiz-dashboard-card__num--point{ color:var(--sidiz-color-blue-700); }
.sidiz-dashboard-card__num--error{ color:var(--sidiz-color-red-600); }
.sidiz-dashboard-card__unit{
  padding-bottom:var(--sidiz-space-5);
  font-size:var(--sidiz-font-size-caption1); font-weight:var(--sidiz-font-weight-semibold);
  line-height:var(--sidiz-font-line-height); letter-spacing:var(--sidiz-font-letter-spacing);
  color:var(--sidiz-color-grey-900);
}
</style>
<!-- ▲▲▲ 조각 CSS 끝 ▲▲▲ -->

<style>
/* (미리보기 전용 — 조각 아님) */
body{ background:var(--sidiz-color-grey-50); }
.preview{ padding:var(--sidiz-space-40); display:flex; flex-direction:column; gap:var(--sidiz-space-24); }
.preview h1{ font-size:var(--sidiz-font-size-title3); font-weight:600; }
.preview .cap{ font-size:var(--sidiz-font-size-caption1); font-weight:600; color:var(--sidiz-color-grey-500); }
.demo-row{ display:flex; gap:var(--sidiz-space-8); }
</style>
</head>
<body>
<div class="preview">
  <h1 class="title3">Dashboard Card — 정본 조각 미리보기</h1>
  <span class="cap">요약 카드 가로 1행 · gap 8</span>

  <div class="demo-row">
    <!-- ▼ 조각 마크업 (기본) — 그대로 복사 ▼ -->
    <div class="sidiz-dashboard-card">
      <span class="sidiz-dashboard-card__tag">전체</span>
      <span class="sidiz-dashboard-card__value">
        <span class="sidiz-dashboard-card__num">1,284</span>
        <span class="sidiz-dashboard-card__unit">건</span>
      </span>
    </div>
    <!-- ▲ 조각 마크업 끝 ▲ -->

    <!-- 포인트(Blue-700) 수치 -->
    <div class="sidiz-dashboard-card">
      <span class="sidiz-dashboard-card__tag">결제완료</span>
      <span class="sidiz-dashboard-card__value">
        <span class="sidiz-dashboard-card__num sidiz-dashboard-card__num--point">932</span>
        <span class="sidiz-dashboard-card__unit">건</span>
      </span>
    </div>

    <!-- 에러(Red-600) 수치 -->
    <div class="sidiz-dashboard-card">
      <span class="sidiz-dashboard-card__tag">취소</span>
      <span class="sidiz-dashboard-card__value">
        <span class="sidiz-dashboard-card__num sidiz-dashboard-card__num--error">37</span>
        <span class="sidiz-dashboard-card__unit">건</span>
      </span>
    </div>
  </div>
</div>
</body>
</html>
