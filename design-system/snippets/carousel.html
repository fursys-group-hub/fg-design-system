<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIDIZ 정본 조각 — Carousel</title>
<!--
  SIDIZ 정본 코드 조각 — Carousel (node 69:9181)
  Indicator: 점 6×6 · gap 12 · Grey-50(비활성 30% 투명 / 활성 불투명)
  Navigator: 버튼 30×30 pill · Grey-50 배경 · gap 20 · Chevron 16 · Grey-800
  어두운 배경(이미지) 위에 얹는다. ⚠️ 그대로 복사해 쓴다.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../../dist/sidiz/tokens.css">
<script src="https://unpkg.com/lucide@latest"></script>

<!-- ▼▼▼ 조각 CSS (그대로 복사) ▼▼▼ -->
<style>
.sidiz-carousel-indicator{ display:flex; align-items:center; gap:var(--sidiz-space-12); }
.sidiz-carousel-indicator__dot{ width:6px; height:6px; border-radius:var(--sidiz-radius-pill); background:var(--sidiz-color-grey-50); opacity:0.3; }
.sidiz-carousel-indicator__dot--active{ opacity:1; }
.sidiz-carousel-nav{ display:inline-flex; align-items:center; gap:var(--sidiz-space-20); }
.sidiz-carousel-nav__btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:30px; height:30px; border:0; border-radius:var(--sidiz-radius-pill);
  background:var(--sidiz-color-grey-50); opacity:0.7; cursor:pointer;
}
.sidiz-carousel-nav__btn svg{ width:16px; height:16px; color:var(--sidiz-color-grey-800); }
</style>
<!-- ▲▲▲ 조각 CSS 끝 ▲▲▲ -->

<style>
body{ background:var(--sidiz-color-grey-50); }
.preview{ padding:var(--sidiz-space-40); display:flex; flex-direction:column; gap:var(--sidiz-space-24); }
.stage{ display:flex; align-items:center; justify-content:center; gap:var(--sidiz-space-40); background:var(--sidiz-color-grey-800); border-radius:var(--sidiz-radius-6); padding:var(--sidiz-space-40); }
</style>
</head>
<body>
<div class="preview">
  <div class="stage">
    <!-- ▼ 조각 마크업 (Indicator) ▼ -->
    <div class="sidiz-carousel-indicator">
      <span class="sidiz-carousel-indicator__dot sidiz-carousel-indicator__dot--active"></span>
      <span class="sidiz-carousel-indicator__dot"></span>
      <span class="sidiz-carousel-indicator__dot"></span>
      <span class="sidiz-carousel-indicator__dot"></span>
    </div>
    <!-- ▼ 조각 마크업 (Navigator) ▼ -->
    <div class="sidiz-carousel-nav">
      <button class="sidiz-carousel-nav__btn"><i data-lucide="chevron-left"></i></button>
      <button class="sidiz-carousel-nav__btn"><i data-lucide="chevron-right"></i></button>
    </div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
